[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stocks-and-investment"
version = "0.1.0a1"
description = "Reproducible, explainable investment research and decision engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Stocks-and-Investment contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
stocks = "stocks_investment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks_investment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = ["live: requires network access and is excluded from normal offline runs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
